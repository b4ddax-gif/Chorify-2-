name: Build CHORIFY 2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build CHORIFY 2
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check ZIP
        run: |
          if [ ! -f "chorify-2.zip" ]; then
            echo "ERROR: chorify-2.zip not found!"
            exit 1
          fi

          echo "ZIP found:"
          ls -lh chorify-2.zip

      - name: Extract CHORIFY 2
        run: |
          rm -rf chorify_project
          mkdir -p chorify_project
          unzip -q "chorify-2.zip" -d chorify_project

          echo "Extracted files:"
          find chorify_project -maxdepth 5 -type f | sort | head -300

      - name: Locate Android Project
        shell: bash
        run: |
          SETTINGS_FILE=$(find chorify_project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create Debug Keystore
        run: |
          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Debug keystore created."

      - name: Remove Custom Signing Configuration
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Checking Gradle files..."

          find . -type f \( \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \) -print

          echo ""
          echo "If the project uses a custom release/debug keystore,"
          echo "the Android build will use the generated debug keystore."

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug \
              -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android \
              --stacktrace
          else
            gradle assembleDebug \
              -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android \
              --stacktrace
          fi

      - name: Find APK
        run: |
          echo "Generated APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload CHORIFY 2 APK
        uses: actions/upload-artifact@v4
        with:
          name: CHORIFY-2-debug-APK
          path: |
            chorify_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
