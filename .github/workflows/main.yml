name: Build CHORIFY 2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project
        run: |
          echo "Files:"
          find . -maxdepth 3 -type f | sort

      - name: Build APK
        run: |
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            gradle assembleDebug --stacktrace
          elif [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
            gradle -p . assembleDebug --stacktrace
          else
            echo "ERROR: Android Gradle project not found."
            echo "build.gradle/build.gradle.kts is missing."
            exit 1
          fi

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHORIFY-2-debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
