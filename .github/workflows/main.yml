name: Build CHORIFY 2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build CHORIFY 2
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check ZIP
        run: |
          echo "Files in repository:"
          ls -lah

          if [ ! -f "chorify-2.zip" ]; then
            echo "ERROR: chorify-2.zip not found!"
            exit 1
          fi

          echo "ZIP found:"
          ls -lh chorify-2.zip

      - name: Extract CHORIFY 2
        run: |
          mkdir -p chorify_project

          unzip -q "chorify-2.zip" -d chorify_project

          echo "Extracted project:"
          find chorify_project -maxdepth 5 -type f | sort | head -300

      - name: Locate Android Project
        shell: bash
        run: |
          echo "Searching extracted project..."

          SETTINGS_FILE=$(find chorify_project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: Android Gradle project was not found inside chorify-2.zip."
            echo ""
            echo "The ZIP must contain settings.gradle or settings.gradle.kts."
            echo ""
            echo "ZIP CONTENT:"
            find chorify_project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android Project
        run: |
          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -lah

          echo ""
          echo "Gradle files:"
          find . -maxdepth 5 -type f \( \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "gradlew" \
          \) -print

      - name: Prepare Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle."
          fi

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Find APK
        run: |
          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload CHORIFY 2 APK
        uses: actions/upload-artifact@v4
        with:
          name: CHORIFY-2-debug-APK
          path: |
            chorify_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
